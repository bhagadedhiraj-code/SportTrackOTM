<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SportTrackOTM</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        nav {
            background: #1f2937;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card a {
            display: inline-block;
            margin-right: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'team_list' %}">Teams</a>
    <a href="{% url 'player_list' %}">Players</a>
    <a href="{% url 'match_list' %}">Matches</a>
    <a href="{% url 'tournament_list' %}">Tournaments</a>
    <a href="/admin/">Admin</a>
</nav>

{% block content %}
{% endblock %}

</body>
</html>
