{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Team - SportTrackOTM</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

<nav>
    <div class="logo">SportTrackOTM</div>

    <a href="/">Home</a>
    <a href="{% url 'team_list' %}">Teams</a>
    <a href="{% url 'player_list' %}">Players</a>
    <a href="{% url 'match_list' %}">Matches</a>
    <a href="{% url 'tournament_list' %}">Tournaments</a>
    <a href="/admin/">Admin</a>
</nav>

<div class="container">

    <h1>Edit Team</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Update Team</button>
    </form>

    <br>

    <a href="{% url 'team_list' %}">
        Back to Teams
    </a>

</div>

</body>
</html>
